name: Gemini CLI

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Prompt for Gemini CLI'
        required: false
        default: 'Hello, Gemini!'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/gemini.yml'

permissions:
  contents: read

jobs:
  gemini:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run Gemini CLI
        uses: google-github-actions/run-gemini-cli@v0.1.22
        continue-on-error: true
        with:
          prompt: ${{ inputs.prompt || 'Hello, Gemini!' }}
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
