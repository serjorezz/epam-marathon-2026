name: Build

on:
  pull_request:
    branches:
      - main
    paths:
      - "frontend/restaurant-frontend-app/**"
      - ".github/workflows/pr.yml"

  push:
    branches:
      - main
    paths:
      - "frontend/restaurant-frontend-app/**"
      - ".github/workflows/pr.yml"

  workflow_dispatch:

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: write
  pages: write

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend/restaurant-frontend-app
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/restaurant-frontend-app/.nvmrc
          cache: npm
          cache-dependency-path: frontend/restaurant-frontend-app/package-lock.json

      - name: Install
        run: npm ci --prefer-offline --no-audit

      - name: Lint
        run: npm run lint

      - name: Type-check app
        run: npx tsc -p tsconfig.app.json --noEmit

      - name: Type-check specs
        run: npx tsc -p tsconfig.spec.json --noEmit

      - name: Production build
        run: npm run build
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL || 'https://pin0yvpmgk.execute-api.us-east-1.amazonaws.com/develop' }}

      - name: Prepare SPA fallback & custom domain
        run: |
          build_dir="dist/restaurant-frontend-app/browser"
          cp "$build_dir/index.html" "$build_dir/404.html"
          touch "$build_dir/.nojekyll"
          echo "green-tasty.devs.surf" > "$build_dir/CNAME"

      - name: Configure AWS credentials
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_S3_ROLE || 'arn:aws:iam::060913167510:role/GitHubActionsDeployRole' }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Deploy to S3
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        run: npm run deploy

      - name: Sync gh-pages branch
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        run: |
          build_dir="$(pwd)/dist/restaurant-frontend-app/browser"
          tmp_dir="$(mktemp -d)"
          git config --global user.name "Serhii"
          git config --global user.email "serjorez@proton.me"
          if git fetch origin gh-pages --depth 1 2>/dev/null; then
            git worktree add -B gh-pages "$tmp_dir" origin/gh-pages
            cd "$tmp_dir"
            find . -maxdepth 1 ! -name '.git' ! -name '.' -exec rm -rf {} +
            cp -r "$build_dir"/. .
            git add -A
            if ! git diff --staged --quiet; then
              git commit -m "chore(gh-pages): deploy ${GITHUB_SHA::7}"
              git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
            else
              echo "gh-pages is already up to date, skipping push."
            fi
            cd - > /dev/null
            git worktree remove --force "$tmp_dir"
          else
            cd "$tmp_dir"
            git init -b gh-pages
            cp -r "$build_dir"/. .
            git add -A
            git commit -m "chore(gh-pages): deploy ${GITHUB_SHA::7}"
            git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
          fi
