      - name: Production build
        run: npm run build
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL || 'https://pin0yvpmgk.execute-api.us-east-1.amazonaws.com/develop' }}

      - name: Configure AWS credentials
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_S3_ROLE || 'arn:aws:iam::060913167510:role/GitHubActionsDeployRole' }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Deploy to S3
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        run: npm run deploy

      - name: Deploy to GitHub Pages (gh-pages)
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: frontend/restaurant-frontend-app/dist/restaurant-frontend-app/browser
          cname: green-tasty.devs.surf
          force_orphan: true
