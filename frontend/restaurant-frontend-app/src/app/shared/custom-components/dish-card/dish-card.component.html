<div
  class="dish-card"
  role="button"
  [tabindex]="isUnavailable() ? -1 : 0"
  [class.unavailable]="isUnavailable()"
  [style.max-width]="maxWidth() || null"
  (click)="onCardClicked()"
  (keydown.space)="onCardClicked()"
  (keydown.enter)="onCardClicked()"
>
  @if (isUnavailable()) {
    <div class="status-badge">{{ dishStateLabel() }}</div>
  }

  @if (showFavorite()) {
    <div class="favorite-wrapper">
      <button
        type="button"
        class="favorite-btn"
        [class.is-favorite]="isFavorite()"
        [attr.aria-label]="(isFavorite() ? 'In favorite' : 'Add to favorite') | translate"
        (click)="onFavoriteClick($event)"
      >
        <svg
          class="star-icon"
          viewBox="0 0 24 24"
          width="20"
          height="20"
          aria-hidden="true"
          focusable="false"
        >
          <path
            d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"
          />
        </svg>
        <span class="favorite-tooltip" role="tooltip">
          {{ (isFavorite() ? 'In favorite' : 'Add to favorite') | translate }}
        </span>
      </button>
    </div>
  }

  <img [src]="dish().imageUrl" alt="{{ dish().name | translate }}" class="dish-image" />
  <div class="dish-info">
    <div class="dish-heading">
      <div class="dish-name">{{ dish().name | translate }}</div>
      <div class="dish-meta">
        <span class="dish-price">{{ dish().price | currency: '$' }}</span>
        <span class="dish-weight">{{ dish().weight | translate }}</span>
      </div>
    </div>
    @if (preOrderEnabled()) {
      <app-custom-button size="small" fullWidth [disabled]="isUnavailable()" (click)="preOrderClicked.emit()">
        {{ 'Pre-Order' | translate }}
      </app-custom-button>
    }
  </div>
  <ng-content select="[dish-footer]"></ng-content>
</div>
