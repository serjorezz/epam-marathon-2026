<div class="table-card">
  <div class="image-wrapper"></div>

  <div class="card-content">
    <div class="card-header">
      <span class="table-number">{{ 'Table' | translate }} {{ table().tableNumber }}</span>
      <span class="capacity">{{ 'Up to' | translate }} {{ table().capacity }} {{ (table().capacity === 1 ? 'guest' : 'guests') | translate }}</span>
    </div>

    <span class="location-name">{{ location() | translate }}</span>

    <div class="time-slots">
      @for (slot of hourSlots(); track $index) {
        <app-time-slot
          class="time-slot compact"
          [label]="slot.label"
          [disabled]="!slot.timeRange"
          (click)="onTimeSlotSelected(slot)"
        >
        </app-time-slot>
      }
    </div>
  </div>
</div>
